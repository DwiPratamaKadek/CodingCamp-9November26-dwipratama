<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── Dark/Light Toggle ── -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
    <span id="themeIcon">🌙</span>
  </button>

  <div class="container">

    <!-- ── Header / Balance ── -->
    <header class="card balance-card">
      <p class="balance-label">Total Balance</p>
      <h1 class="balance-amount" id="totalBalance">Rp 0</h1>
      <div class="balance-meta">
        <span id="txCount">0 transactions</span>
        <span id="monthLabel" class="month-badge"></span>
      </div>
    </header>

    <!-- ── Spending Limit Warning ── -->
    <div class="limit-banner hidden" id="limitBanner">
      ⚠️ You have exceeded your monthly spending limit!
    </div>

    <!-- ── Monthly Summary ── -->
    <section class="card summary-card" id="summaryCard">
      <div class="section-header">
        <h2>Monthly Summary</h2>
        <div class="month-nav">
          <button class="btn-icon" id="prevMonth" aria-label="Previous month">&#8249;</button>
          <span id="summaryMonthLabel">—</span>
          <button class="btn-icon" id="nextMonth" aria-label="Next month">&#8250;</button>
        </div>
      </div>
      <div class="summary-grid" id="summaryGrid">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- ── Chart ── -->
    <section class="card chart-card">
      <h2>Spending by Category</h2>
      <div class="chart-wrapper">
        <canvas id="spendingChart"></canvas>
        <p class="chart-empty hidden" id="chartEmpty">No expenses yet.</p>
      </div>
    </section>

    <!-- ── Add Transaction Form ── -->
    <section class="card form-card">
      <h2>Add Transaction</h2>
      <form id="txForm" novalidate>
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input
            type="text"
            id="itemName"
            placeholder="e.g. Lunch, Bus Ticket"
            autocomplete="off"
          />
          <span class="error-msg" id="nameError">Please enter an item name.</span>
        </div>

        <div class="form-group">
          <label for="amount">Amount (Rp)</label>
          <input
            type="number"
            id="amount"
            placeholder="e.g. 25000"
            min="1"
          />
          <span class="error-msg" id="amountError">Please enter a valid amount.</span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">— Select category —</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Fun">🎉 Fun</option>
          </select>
          <span class="error-msg" id="categoryError">Please select a category.</span>
        </div>

        <!-- Spending Limit -->
        <div class="form-group">
          <label for="spendingLimit">Monthly Spending Limit (Rp) <span class="optional">(optional)</span></label>
          <input
            type="number"
            id="spendingLimit"
            placeholder="e.g. 500000"
            min="0"
          />
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">+ Add Transaction</button>
      </form>
    </section>

    <!-- ── Transaction List ── -->
    <section class="card list-card">
      <div class="section-header">
        <h2>Transactions</h2>
        <button class="btn-danger-sm" id="clearAllBtn">Clear All</button>
      </div>
      <div class="tx-list" id="txList">
        <p class="empty-msg" id="emptyMsg">No transactions yet. Add one above!</p>
      </div>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
